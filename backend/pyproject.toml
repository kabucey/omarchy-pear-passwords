[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pear-passwords-backend"
version = "2.0.3"
description = "Backend for Pear Passwords: sign in to iCloud and sync your passwords on Linux"
requires-python = ">=3.10"
dependencies = [
    # Exact pins, matching requirements.lock (which also pins every transitive dependency
    # with hashes). install.sh installs from the lock with hash checking; these only make
    # the package's own metadata agree with it.
    "requests==2.34.2",
    "certifi==2026.7.22",
    "srp==1.0.22",
    "cryptography==50.0.1",
    "pynacl==1.6.2",
    "secretstorage==3.5.0",
]

license = "MIT"

[project.scripts]
icp = "icp.cli.app:main"

[tool.setuptools.packages.find]
include = ["icp*"]

[tool.setuptools.package-data]
# Apple's root CA, pinned for the gateway TLS chain. Not Python, so it must be declared.
icp = ["certs/*.pem"]
