<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Pear Passwords: the fontconfig the window runs with (pear-exec sets FONTCONFIG_FILE to the
  installed copy, /usr/local/lib/pear-passwords/etc/fonts.conf).

  System-only on purpose. The stock /etc/fonts/fonts.conf pulls in 50-user.conf, which reads
  ~/.config/fontconfig and ~/.local/share/fonts: files any program running as you can write,
  and so a way to put a font (a parser attack surface) or a config into the password window.
  Here every directory and include is root-owned, and the cache is the system one, never
  ~/.cache/fontconfig. A font you installed only for yourself will not appear in this window.

  The includes are the system's own defaults (what /etc/fonts/conf.d enables on Arch and
  Omarchy), minus 50-user.conf and 51-local.conf. Missing ones are skipped.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>

  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-hinting-slight.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-scale-bitmap-fonts.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-yes-antialias.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/11-lcdfilter-default.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/20-unhint-small-vera.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/30-metric-aliases.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/40-nonlatin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/45-generic.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/45-latin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/46-noto-sans.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/46-noto-serif.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/48-guessfamily.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/48-spacing.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/49-sansserif.conf</include>
  <!-- Omarchy's monospace / sans / serif choices, so the window matches the desktop. -->
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/50-omarchy.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/60-generic.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/60-latin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/65-fonts-persian.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/65-nonlatin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/66-noto-sans.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/66-noto-serif.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/69-unifont.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/80-delicious.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/90-synthetic.conf</include>
</fontconfig>
